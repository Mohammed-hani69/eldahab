{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1 style="font-size:1.3rem;font-weight:700;color:var(--text);margin:0;">
        {% if not supplier %}<i class="fas fa-user-plus" style="margin-left:8px;"></i> اضافة مورد جديد{% else %}<i class="fas fa-edit" style="margin-left:8px;"></i> تعديل بيانات المورد{% endif %}
    </h1>
    <a href="{{ url_for('suppliers_list') }}" class="btn btn-ghost"><i class="fas fa-arrow-right" style="margin-left:4px;"></i> رجوع للقائمة</a>
</div>

<form method="POST" action="{{ url_for('supplier_edit', supplier_id=supplier.id) if supplier else url_for('supplier_add') }}">
    <div class="two-col">

        <div class="data-card">
            <div class="data-card-header">
                <h3><i class="fas fa-id-card" style="margin-left:6px;color:var(--gold);"></i> البيانات الاساسية</h3>
                <span style="font-size:0.72rem;color:var(--text-muted);">الحقول المطلوبة *</span>
            </div>
            <div class="data-card-body">
                <div class="form-group">
                    <label><i class="fas fa-user" style="margin-left:4px;color:var(--gold);font-size:0.78rem;"></i> اسم المورد *</label>
                    <input type="text" name="name" class="form-control" value="{{ supplier.name if supplier else '' }}" required placeholder="ادخل اسم المورد" autofocus>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-phone" style="margin-left:4px;color:var(--gold);font-size:0.78rem;"></i> رقم الهاتف</label>
                        <input type="text" name="phone" class="form-control" value="{{ supplier.phone if supplier else '' }}" placeholder="01xxxxxxxxx" dir="ltr" style="text-align:right;">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label><i class="fas fa-map-marker-alt" style="margin-left:4px;color:var(--gold);font-size:0.78rem;"></i> العنوان</label>
                        <input type="text" name="address" class="form-control" value="{{ supplier.address if supplier else '' }}" placeholder="العنوان (اختياري)">
                    </div>
                </div>
            </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:20px;">
            <div class="data-card">
                <div class="data-card-header">
                    <h3><i class="fas fa-sticky-note" style="margin-left:6px;color:var(--gold);"></i> ملاحظات</h3>
                </div>
                <div class="data-card-body">
                    <textarea name="notes" class="form-control" rows="5" placeholder="اضف ملاحظات حول المورد..." style="resize:vertical;">{{ supplier.notes if supplier else '' }}</textarea>
                </div>
            </div>

            <div class="data-card" style="border:none;box-shadow:none;background:transparent;">
                <div style="display:flex;gap:10px;">
                    <button type="submit" class="btn btn-gold btn-lg" style="flex:1;">
                        <i class="fas fa-save"></i> {% if not supplier %}اضافة المورد{% else %}حفظ التعديلات{% endif %}
                    </button>
                    <a href="{{ url_for('suppliers_list') }}" class="btn btn-outline btn-lg">الغاء</a>
                </div>
                <div style="margin-top:12px;padding:12px 16px;background:var(--success-bg);border-radius:var(--radius-xs);border:1px solid rgba(16,185,129,0.12);">
                    <div style="display:flex;align-items:center;gap:8px;font-size:0.78rem;color:var(--success);font-weight:500;">
                        <i class="fas fa-shield-alt"></i>
                        <span>جميع البيانات مشفرة ومؤمنة</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</form>
{% endblock %}
