<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Dahab Trading</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="splash-screen" id="splash">
        <div class="splash-particles">
            <div class="splash-particle" style="left:8%;animation-delay:0s"></div>
            <div class="splash-particle" style="left:16%;animation-delay:0.6s"></div>
            <div class="splash-particle" style="left:24%;animation-delay:1.2s"></div>
            <div class="splash-particle" style="left:32%;animation-delay:0.3s"></div>
            <div class="splash-particle" style="left:40%;animation-delay:0.9s"></div>
            <div class="splash-particle" style="left:48%;animation-delay:1.5s"></div>
            <div class="splash-particle" style="left:56%;animation-delay:0.2s"></div>
            <div class="splash-particle" style="left:64%;animation-delay:0.8s"></div>
            <div class="splash-particle" style="left:72%;animation-delay:1.4s"></div>
            <div class="splash-particle" style="left:80%;animation-delay:0.5s"></div>
            <div class="splash-particle" style="left:88%;animation-delay:1.1s"></div>
            <div class="splash-particle" style="left:95%;animation-delay:1.8s"></div>
        </div>
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="splash-logo">
        <h1 class="splash-title"><span>El Dahab</span> Trading</h1>
        <p class="splash-subtitle">نظام المحاسبة - مستلزمات الفنادق</p>
        <div class="splash-loader">
            <div class="splash-loader-bar"></div>
        </div>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = '{{ url_for("dashboard") }}';
        }, 4200);
    </script>
</body>
</html>
