<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مستلزمات الفنادق</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #1a365b 0%, #0d1f3c 50%, #1a365b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a365b 0%, #0d1f3c 50%, #1a365b 100%);
            z-index: 0;
        }

        .login-bg .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.06;
            background: #cfa340;
        }
        .login-bg .circle:nth-child(1) { width: 400px; height: 400px; top: -100px; right: -100px; animation: float 20s infinite; }
        .login-bg .circle:nth-child(2) { width: 300px; height: 300px; bottom: -80px; left: -80px; animation: float 15s infinite reverse; }
        .login-bg .circle:nth-child(3) { width: 200px; height: 200px; top: 50%; left: 50%; animation: float 25s infinite; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 48px 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 50%;
            overflow: hidden;
            background: #1a365b;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(26, 54, 91, 0.3);
        }

        .login-logo img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a365b;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a365b;
            margin-bottom: 6px;
        }

        .form-group label i {
            color: #cfa340;
            margin-left: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .form-control {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            transition: all 0.3s;
            background: #f8fafc;
        }

        .form-control:focus {
            border-color: #cfa340;
            box-shadow: 0 0 0 3px rgba(207, 163, 64, 0.15);
            background: #fff;
            outline: none;
        }

        .form-control:focus + i,
        .form-control:focus ~ i {
            color: #cfa340;
        }

        .input-wrapper:focus-within i {
            color: #cfa340;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #cfa340 0%, #b8922e 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(207, 163, 64, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(207, 163, 64, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login i {
            margin-left: 8px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .alert-danger {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #fed7d7;
        }

        .alert-warning {
            background: #fffff0;
            color: #b7791f;
            border: 1px solid #fefcbf;
        }

        .alert-info {
            background: #ebf8ff;
            color: #2b6cb0;
            border: 1px solid #bee3f8;
        }

        .alert-success {
            background: #f0fff4;
            color: #276749;
            border: 1px solid #c6f6d5;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .login-card { padding: 36px 24px; }
            .login-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="login-bg">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
            </div>
            <h1 class="login-title">مستلزمات الفنادق</h1>
            <p class="login-subtitle">El Dahab Trading</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i>اسم المستخدم</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required autofocus autocomplete="username">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i>كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i>تسجيل الدخول
                </button>
            </form>
        </div>
        <div class="login-footer">
            &copy; 2026 مستلزمات الفنادق - جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        // Auto-dismiss flash messages
        document.querySelectorAll('.alert').forEach(function(el) {
            setTimeout(function() {
                el.style.transition = 'opacity 0.5s';
                el.style.opacity = '0';
                setTimeout(function() { el.remove(); }, 500);
            }, 4000);
        });
    </script>
</body>
</html>
