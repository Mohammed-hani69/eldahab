{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1 style="font-size:1.3rem;font-weight:700;color:var(--text);margin:0;">
        <i class="fas fa-shipping-fast" style="margin-left:8px;"></i>
        {% if company %}تعديل شركة الشحن{% else %}اضافة شركة شحن جديدة{% endif %}
    </h1>
    <a href="{{ url_for('shipping_list') }}" class="btn btn-ghost"><i class="fas fa-arrow-right" style="margin-left:4px;"></i> رجوع للقائمة</a>
</div>

<div class="two-col">
    <div>
        <div class="data-card">
            <div class="data-card-header">
                <h3><i class="fas fa-info-circle" style="margin-left:6px;color:var(--gold);"></i> بيانات شركة الشحن</h3>
                <span style="font-size:0.72rem;color:var(--text-muted);">الحقول المطلوبة *</span>
            </div>
            <div class="data-card-body">
                <form method="POST">
                    <div class="form-group">
                        <label><i class="fas fa-building" style="margin-left:4px;color:var(--gold);font-size:0.78rem;"></i> اسم الشركة *</label>
                        <input type="text" name="name" class="form-control" value="{{ company.name if company else '' }}" required placeholder="اسم شركة الشحن">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-phone" style="margin-left:4px;color:var(--gold);font-size:0.78rem;"></i> التليفون</label>
                            <input type="text" name="phone" class="form-control" value="{{ company.phone if company else '' }}" placeholder="رقم التليفون">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-user-tie" style="margin-left:4px;color:var(--gold);font-size:0.78rem;"></i> المسؤول</label>
                            <input type="text" name="contact_person" class="form-control" value="{{ company.contact_person if company else '' }}" placeholder="اسم المسؤول">
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt" style="margin-left:4px;color:var(--gold);font-size:0.78rem;"></i> العنوان</label>
                        <input type="text" name="address" class="form-control" value="{{ company.address if company else '' }}" placeholder="العنوان">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label><i class="fas fa-sticky-note" style="margin-left:4px;color:var(--gold);font-size:0.78rem;"></i> ملاحظات</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="ملاحظات اضافية..." style="resize:vertical;">{{ company.notes if company else '' }}</textarea>
                    </div>
                    <div style="margin-top:16px;">
                        <button type="submit" class="btn btn-gold btn-lg" style="width:100%;">
                            <i class="fas fa-save"></i> {% if company %}حفظ التعديلات{% else %}اضافة شركة الشحن{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div>
        <div class="data-card" style="border:none;box-shadow:none;background:transparent;">
            <div style="padding:16px;background:var(--info-bg);border-radius:var(--radius-xs);border:1px solid rgba(59,130,246,0.12);">
                <div style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--info);font-weight:500;">
                    <i class="fas fa-info-circle"></i>
                    <span>بيانات شركة الشحن ستظهر في الفواتير عند الشحن</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
